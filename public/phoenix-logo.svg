<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 290" fill="none">
  <!-- Eye shape (forme oeil/amande noire) -->
  <path d="M 25 110 Q 250 -15 475 110 Q 250 235 25 110 Z" fill="#000000"/>

  <!-- Disque rouge plein -->
  <circle cx="250" cy="110" r="62" fill="#c8202a"/>

  <!-- O blanc (anneau sur le disque rouge) -->
  <circle cx="250" cy="110" r="45" fill="none" stroke="#ffffff" stroke-width="9"/>

  <!-- PH (à gauche du O) -->
  <text x="208" y="132" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="1">PH</text>

  <!-- ENIX (à droite du O) -->
  <text x="295" y="132" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" fill="#ffffff" letter-spacing="1">ENIX</text>

  <!-- SENEGAL en rouge, sous PHOENIX, à droite du centre, dans l'oeil -->
  <text x="316" y="158" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c8202a" letter-spacing="3">SENEGAL</text>

  <!-- Tagline en dehors de l'oeil, gris italique -->
  <text x="250" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#9a9a9a" font-style="italic" letter-spacing="2">securite intelligente</text>
</svg>
